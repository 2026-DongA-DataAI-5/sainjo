<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#007da8">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <meta name="description" content="중고차를 인수한 뒤 정비 기록을 확인하고, 지금 살펴볼 항목과 다음 관리 흐름을 준비하는 차근을 소개합니다.">
  <title>{{ title }} · 차근</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/landing.css', v='20261007-responsive') }}">
</head>
<body class="landing-body">
  <a class="skip-link" href="#main">본문으로 이동</a>
  <header class="landing-header">
    <a class="landing-brand" href="{{ url_for('pages.home') }}" aria-label="차근 서비스 소개"><span class="brand-mark" aria-hidden="true">차</span><span>차근<small>구매 이후의 차량 관리</small></span></a>
    <nav aria-label="서비스 소개"><a href="#how-it-works">서비스</a><a href="#management-records">관리 기록</a><a href="#status-title">관리정보</a><a class="button header-cta" href="{{ url_for('pages.start') }}">차량 관리 시작하기 <span aria-hidden="true">→</span></a></nav>
  </header>
  <main id="main" class="landing-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="landing-footer"><a class="landing-brand footer-brand" href="{{ url_for('pages.home') }}"><span class="brand-mark" aria-hidden="true">차</span><span>차근<small>구매 이후의 차량 관리</small></span></a><p>차근은 기록과 적용 가능한 관리 근거를 바탕으로 확인할 항목을 안내합니다. 실제 차량 상태와 필요한 작업은 전문가의 점검으로 확인하세요.</p><span>사인조 · 차근 서비스 소개</span></footer>
</body>
</html>
