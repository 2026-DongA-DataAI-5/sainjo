{% extends 'base.html' %}
{% block content %}
<div class="page-heading"><div><p class="eyebrow">정비소 방문 전</p><h1>확인할 질문을 준비해 보세요</h1><p class="lede">과거 작업 확인 → 현재 상태 점검 → 필요한 작업 상담으로 이어집니다.</p></div></div><p class="field-note">체크 상태는 현재 브라우저에 저장되며 정비 완료나 점검 결과를 의미하지 않습니다.</p><p class="form-message" data-question-message role="status" aria-live="polite"></p>
{% for item in items %}<section class="question-section"><h2>{{ item.name }}</h2><p class="muted">{{ item.reason }}</p><label class="question-choice"><input type="checkbox" data-question-key="{{ item.key }}:history"><span><strong>과거 작업 확인</strong>{{ item.question }}</span></label><label class="question-choice"><input type="checkbox" data-question-key="{{ item.key }}:inspection"><span><strong>현재 상태 점검</strong>현재 상태를 확인할 점검이 필요한가요?</span></label><label class="question-choice"><input type="checkbox" data-question-key="{{ item.key }}:work"><span><strong>필요한 작업 상담</strong>점검 결과에 따라 필요한 작업과 그 이유는 무엇인가요?</span></label><a class="text-link" href="{{ url_for('pages.item_detail', item_key=item.key) }}">관련 기록과 근거 보기 →</a></section>{% endfor %}<div class="form-actions"><a class="button primary" href="{{ url_for('pages.maintenance_new') }}">정비 결과 입력 화면 →</a></div>
{% endblock %}
