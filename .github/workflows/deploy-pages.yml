name: Deploy Cha-geun to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract project source
        run: python -c "import zipfile; zipfile.ZipFile('sainjo-source.zip').extractall('source')"
      - name: Install application dependencies
        run: python -m pip install -r source/requirements.txt
      - name: Build static site
        run: python source/scripts/build_pages.py
        env:
          PAGES_BASE_PATH: /sainjo
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/docs
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
