name: Python and MySQL tests
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-disposable-db-only
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: chageun_test
        ports: [3306:3306]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-disposable-db-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      CHAGEUN_TEST_MYSQL_HOST: 127.0.0.1
      CHAGEUN_TEST_MYSQL_PORT: 3306
      CHAGEUN_TEST_MYSQL_USER: root
      CHAGEUN_TEST_MYSQL_PASSWORD: ci-disposable-db-only
      CHAGEUN_TEST_MYSQL_DATABASE: chageun_test
      CHAGEUN_TEST_MYSQL_CONFIRM: disposable-test-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r source/requirements-lock.txt
      - name: Initialize disposable schema
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pymysql
          conn = pymysql.connect(host='127.0.0.1', user='root',
                                 password=os.environ['CHAGEUN_TEST_MYSQL_PASSWORD'], database='chageun_test')
          schema = '\n'.join(line for line in Path('source/chageun/schema.sql').read_text().splitlines()
                             if not line.lstrip().startswith('--'))
          with conn.cursor() as cursor:
              for statement in schema.split(';'):
                  if statement.strip(): cursor.execute(statement)
          conn.commit()
          conn.close()
          PY
      - name: Verify ordered migrations on disposable legacy database
        run: python -B source/scripts/check_migrations.py
        env:
          CHAGEUN_MIGRATION_TEST_HOST: 127.0.0.1
          CHAGEUN_MIGRATION_TEST_PORT: 3306
          CHAGEUN_MIGRATION_TEST_USER: root
          CHAGEUN_MIGRATION_TEST_PASSWORD: ci-disposable-db-only
          CHAGEUN_MIGRATION_TEST_DATABASE: chageun_migration_test
          CHAGEUN_MIGRATION_TEST_CONFIRM: disposable-migration-db
      - run: python -B source/scripts/run_tests.py
      - name: Build mock preview from tracked source
        run: python -B source/scripts/build_pages.py
